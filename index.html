<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Train Driver Egypt | محاكي القطار المصري</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-ui">
        <div class="top-panel">
            <div class="info-box">
                <span class="label">السرعة:</span>
                <span id="speed-display">0</span> <span class="unit">كم/س</span>
            </div>
            <div class="info-box">
                <span class="label">المحطة القادمة:</span>
                <span id="station-display">الجيزة (1000م)</span>
            </div>
        </div>
        
        <div id="message-overlay">مرحباً بك في سكك حديد مصر!<br><span style="font-size: 16px;">استخدم الأسهم (W/S) أو الأزرار للقيادة</span></div>

        <div class="controls">
            <button id="btn-brake" class="control-btn brake">فرامل 🛑</button>
            <button id="btn-accel" class="control-btn accel">تسريع 🚄</button>
        </div>
    </div>

    <!-- استدعاء مكتبة Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
